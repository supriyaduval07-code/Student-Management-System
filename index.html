<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>

<body>

    <h1>Student Management System</h1>

    <p>Manage student information and academic details.</p>

    <h2>Dashboard</h2>
<h3>Add Student</h3>

<form id="studentForm">
    <input type="text" id="studentName" placeholder="Student Name" required>
    <input type="text" id="studentUSN" placeholder="USN" required>
    <input type="text" id="studentBranch" placeholder="Branch" required>
    <input type="number" id="studentSemester" placeholder="Semester" required>

    <button type="submit">Add Student</button>
</form>

<h3>Student List</h3>
<div id="studentList"></div>
    <p>Total Students: 0</p>
    <p>Total Courses: 0</p>

    <button>Add Student</button>
    <button>View Students</button>
<script src="script.js"></script>
</body>
</html>
